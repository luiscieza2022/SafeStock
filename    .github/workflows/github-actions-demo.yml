name: Demostración de Github Actions

run-name: ${{ github.actor }} está ejecutando un pipeline
on: [push]

env:
  NOMBRE: Jorge Gonzalez

jobs:
  Saludar-Hello-World:
    runs-on: ubuntu-latest
    steps:
      - name: Saludo con mi nombre
        run: echo "Hola, soy $NOMBRE y este pipeline se ejecutó por un ${{ github.event_name }}"
      - name: Checkout del repositorio
        uses: actions/checkout@v6
      - name: Listar los archivos del repo
        run: ls ${{ github.workspace }}